name: Release Windows Installer

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      UMD_BUILD_VERSION: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from tag
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tags must use the format vMAJOR.MINOR.PATCH, for example v4.4.0"
          }
          $version = $tag.Substring(1)
          "UMD_BUILD_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Release version: $version"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: cmd
        run: BUILD_INSTALLER.bat

      - name: Verify release files
        shell: powershell
        run: |
          $exe = "installer_output/UniversalMediaDownloader_Setup_v$env:UMD_BUILD_VERSION.exe"
          $sha = "$exe.sha256.txt"
          if (-not (Test-Path $exe)) { throw "Installer not found: $exe" }
          if (-not (Test-Path $sha)) { throw "Checksum not found: $sha" }

      - name: Create GitHub release and upload installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Universal Media Downloader v${{ env.UMD_BUILD_VERSION }}
          generate_release_notes: true
          files: |
            installer_output/UniversalMediaDownloader_Setup_v${{ env.UMD_BUILD_VERSION }}.exe
            installer_output/UniversalMediaDownloader_Setup_v${{ env.UMD_BUILD_VERSION }}.exe.sha256.txt
            installer_output/BUILD_INFO.txt
